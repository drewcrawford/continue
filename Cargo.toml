[package]
name = "continue"
version = "0.1.3"
authors = ["Drew Crawford <drew@sealedabstract.com>"]

edition = "2024"
description = "Swift-style continuation API"
homepage = "https://sealedabstract.com/code/continue"
repository = "https://github.com/drewcrawford/continue"
license = "MIT OR Apache-2.0"
keywords = ["continuation", "async", "await", "futures", "task"]
categories = ["asynchronous", "concurrency", "rust-patterns" ]
exclude = [".*"]
rust-version = "1.95.0"

[dependencies]
atomic-waker = "1.1.2"
# Temporary pre-release pin for the coordinated breaking migration. This must
# name the *same* revision as every other crate that can share a graph with
# this one -- `some_executor`, `test_executors`, `async_file`, `wasm_lite_std`,
# `some_executor_tokio` all pin 1be396f. Two git revisions of the facade are
# two crates to cargo, so a mismatch puts two install-once dispatch globals in
# one process and silently makes one of them inert.
logwise = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/logwise.git", rev = "1be396ff30588ad32453596bbaa45afb568368f7" }

[features]
default = []
logwise-forensic = []

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
wasm_lite = "0.1.0"
wasm_lite_std = "0.1.0"
