[package]
name = "continue"
version = "0.1.3"
authors = ["Drew Crawford <drew@sealedabstract.com>"]

edition = "2024"
description = "Swift-style continuation API"
homepage = "https://sealedabstract.com/code/continue"
repository = "https://github.com/drewcrawford/continue"
license = "MIT OR Apache-2.0"
keywords = ["continuation", "async", "await", "futures", "task"]
categories = ["asynchronous", "concurrency", "rust-patterns" ]
exclude = [".*"]
rust-version = "1.95.0"

[dependencies]
atomic-waker = "1.1.2"
# Temporary pre-release pin for the coordinated breaking migration. This must
# name the *same* revision as every other crate that can share a graph with
# this one -- `some_executor`, `test_executors`, `async_file`, `wasm_lite_std`,
# `some_executor_tokio` all pin 1be396f. Two git revisions of the facade are
# two crates to cargo, so a mismatch puts two install-once dispatch globals in
# one process and silently makes one of them inert.
logwise = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/logwise.git", rev = "1be396ff30588ad32453596bbaa45afb568368f7" }
# Both optional and both pulled in only by the `exfiltrate` feature, so the
# default dependency graph of this crate is unchanged. `wasm_lite_std` is here
# for its `Instant`, which works on wasm32 where `std::time::Instant` does not.
exfiltrate = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/exfiltrate.git", rev = "3200c140f628ddc69c051fd751baf4bbd313fa07", optional = true }
wasm_lite_std = { version = "0.1.4", optional = true }

[features]
default = []
# A bounded registry of outstanding continuations, exposed through exfiltrate's
# `snapshot` command. Off by default: this crate is meant to be a lightweight
# primitive, and the registry costs an insert and a lock per continuation.
exfiltrate = ["dep:exfiltrate", "dep:wasm_lite_std"]
logwise-forensic = []

[dev-dependencies]
# For decoding the structured `snapshot` responses in the registry tests. Both
# are dev-only: a consumer of this crate needs neither.
rmp-serde = "1.3.1"
# Not target-gated: `#[wasm_lite_test]` registers a libtest `#[test]` off
# wasm32, so one attribute covers both targets.
wasm_lite = "0.1.4"
exfiltrate_internal = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/exfiltrate.git", rev = "3200c140f628ddc69c051fd751baf4bbd313fa07" }
wasm_lite_std = "0.1.4"

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
wasm_lite = "0.1.0"
wasm_lite_std = "0.1.0"

# Its own binary: the registry is process-global and the crate's unit tests
# create continuations of their own, so nothing asserting on what it holds is
# deterministic in that process.
[[test]]
name = "registry"
path = "tests/registry.rs"
required-features = ["exfiltrate"]
