# matrix v11
on: [push,pull_request]
jobs:
  ci:
    name: Build (${{ matrix.os }} ${{ matrix.cwd }} ${{ matrix.channel }} ${{ matrix.target }} ${{ matrix.features }})

    runs-on: ${{matrix.os}}

    # A job that wedges rather than fails otherwise runs until the forge's
    # default cap, which is hours: it holds a runner the whole time and reports
    # nothing. Fail it fast instead. Raise it in the project that needs it — a
    # suite whose honest runtime approaches this should get a longer limit here
    # rather than a template that accommodates the slowest repo.
    timeout-minutes: 15


    strategy:
      matrix:
        target: [ "native" ]
        os: [ ubuntu-latest ]

        # only if wasm is needed
        include:
          - os: ubuntu-latest
            target: "wasm32"
        # other items may be listed here as well
        # If so, they should be preserved

    steps:
      - uses: actions/checkout@v4

      - name: Cache target
        uses: actions/cache@v4
        with:
          key: target-${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.target || 'host' }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          path: |
            target
          restore-keys: |
            target-${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.target || 'host' }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
            target-${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.target || 'host' }}

      - name: Install wasm target
        if: matrix.target == 'wasm32' && !(env.GITEA_ACTIONS == 'true')
        run: |
                rustup target add wasm32-unknown-unknown
                rustup +nightly target add wasm32-unknown-unknown

      - name: Install nightly components
        if: matrix.target == 'wasm32' && !(env.GITEA_ACTIONS == 'true')
        run: |
          rustup +nightly component add rustfmt clippy
          rustup +nightly component add rust-src

      # scripts/wasm32/tests drives the browser through `wasm_lite run`.
      - name: Install wasm_lite runner
        if: matrix.target == 'wasm32'
        run: cargo install wasm_lite_cli

      - name: rustfmt
        run: scripts/fmt

      - name: cargo check
        run: |
          # we need ssh-add here to load local deps
          if [[ "$GITEA_ACTIONS" == "true" ]]; then
            eval `ssh-agent`
            ssh-add
          fi
          scripts/${{ matrix.target }}/check

      - name: clippy
        run: scripts/${{ matrix.target }}/clippy

      - name: tests
        run: scripts/${{ matrix.target }}/tests

      - name: docs
        run: scripts/${{ matrix.target }}/docs
